name: Tests

on:
  pull_request:
  workflow_call:

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync

      - name: Linting
        run: |
          uv run flake8 . --exclude .venv,build,dist --count --select=E9,F63,F7,F82 --show-source --statistics
          uv run flake8 . --exclude .venv,build,dist --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check code format with Black
        run: uv run black --check us

  testing:
    needs: linting
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 7
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      - name: Test with pytest
        run: uv run pytest .

  building:
    needs: linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Build package
        run: uv build --wheel

      - uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: ./dist/*.whl
